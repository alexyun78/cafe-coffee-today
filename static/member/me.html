<!DOCTYPE html>
<!--
  92도씨 마이페이지 — /me
  1단계는 로그인 뼈대까지다. 정복 기록과 원두 노트는 2단계에서 이 페이지에 붙는다.
-->
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 기록 — 92°C ROASTERY</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" href="/static/img/logo-92black.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/member/member.css">
    <style>
        .profile { display: flex; align-items: center; gap: 18px; }
        .avatar {
            width: 62px; height: 62px; border-radius: 50%; flex: none;
            background: var(--canvas-stone); object-fit: cover;
            display: grid; place-items: center; font-size: 1.5rem; color: var(--ink-soft);
        }
        .profile-name { font-family: var(--font-display); font-size: 1.55rem; font-weight: 600; line-height: 1.2; }
        .profile-mail { font-size: 0.85rem; color: var(--ink-soft); word-break: break-all; }

        .nick-row { display: flex; gap: 10px; margin-top: 8px; }
        .nick-row .field { flex: 1; }
        .nick-row .btn { width: auto; padding: 12px 20px; }

        /* 시크릿 원두 수집 현황 */
        .mission-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
        .mission-count { font-family: var(--font-mono); font-size: 0.85rem; color: var(--copper); }
        .mission-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px; margin-top: 18px;
        }
        .slot {
            border: 1px solid var(--line); border-radius: 14px; padding: 16px 14px;
            min-height: 128px; display: flex; flex-direction: column; justify-content: center;
            text-align: center; gap: 7px;
        }
        .slot.open { background: var(--canvas); }
        .slot.open .nm {
            font-family: var(--font-display); font-size: 1.08rem; font-weight: 600; line-height: 1.25;
        }
        .slot.open .ln { font-size: 0.76rem; color: var(--ink-soft); line-height: 1.5; }
        .slot.shut {
            border-style: dashed; color: var(--ink-soft);
            background: repeating-linear-gradient(
                135deg, var(--canvas-stone), var(--canvas-stone) 9px, #EDE5D9 9px, #EDE5D9 18px);
        }
        .slot .mark { font-size: 1.5rem; opacity: 0.55; }
        .slot.shut .q {
            font-family: var(--font-display); font-size: 1.5rem; letter-spacing: 0.12em; opacity: 0.55;
        }
        .slot .meta { font-family: var(--font-mono); font-size: 0.68rem; color: var(--ink-soft); }
        .tasted-list { margin-top: 18px; border-top: 1px solid var(--line-soft); }
        .tasted-row {
            display: flex; align-items: center; gap: 12px; padding: 13px 2px;
            border-bottom: 1px solid var(--line-soft);
        }
        .tasted-row .em { font-size: 1.15rem; width: 24px; text-align: center; flex: none; }
        .tasted-row .nm { flex: 1; font-weight: 600; font-size: 0.94rem; }
        .tasted-row .nm small { display: block; font-weight: 400; color: var(--ink-soft); font-size: 0.76rem; }
        .tasted-row .dt { font-family: var(--font-mono); font-size: 0.76rem; color: var(--ink-soft); }
        .tasted-row .go { font-size: 0.8rem; color: var(--copper); }
        .mission-note { margin-top: 16px; font-size: 0.84rem; color: var(--ink-soft); line-height: 1.7; }
        .badge-done {
            margin-top: 18px; padding: 16px 18px; border-radius: 12px; text-align: center;
            background: #F6EFE2; border: 1px solid #E8D9BC; color: #6A4B1E;
        }
        .badge-done .t { font-family: var(--font-display); font-size: 1.3rem; font-weight: 600; }
        .just-opened {
            margin-top: 14px; padding: 13px 16px; border-radius: 11px; font-size: 0.9rem;
            background: var(--canvas-stone); color: var(--ink-mute);
        }
        .just-opened a { color: var(--copper); text-decoration: underline; text-underline-offset: 3px; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
<nav class="site-nav">
    <div class="nav-inner">
        <a class="brand" href="/"><span class="brand-mark">92</span><span class="temp-mark">°C</span> ROASTERY</a>
        <a class="nav-back" href="/">홈</a>
    </div>
</nav>

<main class="shell shell-wide" id="app" hidden>
    <p class="eyebrow">My Record</p>
    <h1 id="hello">내 기록</h1>

    <div class="notice notice-ok" id="welcome" hidden style="margin-top: 22px;">
        <strong>가입을 환영합니다.</strong><br>
        이제부터 92도씨에서 마신 필터 커피가 여기에 쌓입니다.
    </div>

    <div class="panel" style="margin-top: 28px;">
        <div class="profile">
            <img class="avatar" id="avatar" alt="" hidden>
            <div class="avatar" id="avatar-fallback">🫘</div>
            <div>
                <div class="profile-name" id="name">—</div>
                <div class="profile-mail" id="mail"></div>
            </div>
        </div>

        <div style="margin-top: 24px;">
            <label class="lbl" for="nick">매장에서 불러드릴 이름</label>
            <div class="nick-row">
                <input class="field" id="nick" maxlength="20" placeholder="예: 준호, 라떼러버">
                <button class="btn" id="save-nick">저장</button>
            </div>
            <p class="muted" id="nick-msg" style="margin-top: 8px;"></p>
        </div>
    </div>

    <div class="panel" id="tasted-panel" hidden>
        <div class="mission-head">
            <h2 style="margin:0">맛본 원두</h2>
            <span class="mission-count" id="tasted-count"></span>
        </div>
        <div class="tasted-list" id="tasted-list"></div>
        <p class="mission-note">원두를 눌러 들어가면 좋아요, 중간, 싫어요와 감상평을 남길 수 있습니다. 나만 볼 수 있습니다.</p>
    </div>

    <div class="panel" id="mission-panel">
        <div class="mission-head">
            <h2 style="margin:0">시크릿 원두</h2>
            <span class="mission-count" id="mission-count"></span>
        </div>
        <div class="mission-grid" id="mission-grid"></div>
        <p class="mission-note" id="mission-note"></p>
        <div class="badge-done" id="badge-done" hidden>
            <div class="t">🏅 완주</div>
            시크릿 원두를 모두 열었습니다. 매장에서 이 화면을 보여주세요.
        </div>
    </div>

    <div class="panel">
        <h2>계정</h2>
        <p class="muted" id="joined"></p>
        <div style="margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap;">
            <button class="btn btn-quiet" id="logout">로그아웃</button>
            <a class="btn btn-quiet" href="/privacy">개인정보 처리방침</a>
        </div>
    </div>
</main>

<script>
(function () {
    var app = document.getElementById('app');

    function fmtDate(iso) {
        if (!iso) return '';
        var d = new Date(iso);
        if (isNaN(d)) return iso.slice(0, 10);
        return d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일';
    }

    function render(m) {
        var display = m.nickname || m.name || '회원';
        document.getElementById('hello').textContent = display + '님의 기록';
        document.getElementById('name').textContent = m.name || display;
        document.getElementById('mail').textContent = m.email || '';
        document.getElementById('nick').value = m.nickname || '';
        document.getElementById('joined').textContent = '가입일 ' + fmtDate(m.joined_at);
        if (m.picture) {
            var img = document.getElementById('avatar');
            img.src = m.picture;
            img.referrerPolicy = 'no-referrer';
            img.hidden = false;
            document.getElementById('avatar-fallback').hidden = true;
        }
        app.hidden = false;
    }

    function esc(t) {
        return String(t == null ? '' : t).replace(/[&<>"]/g, function (ch) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch];
        });
    }

    var RATING_MARK = { '좋아요': '👍', '중간': '😐', '싫어요': '👎' };

    function shortDate(iso) {
        if (!iso) return '';
        var d = new Date(iso);
        if (isNaN(d)) return String(iso).slice(0, 10).replace(/-/g, '.');
        return d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' +
               String(d.getDate()).padStart(2, '0');
    }

    function renderTasted(p) {
        var panel = document.getElementById('tasted-panel');
        var list = (p && p.tasted) || [];
        if (!list.length) { panel.hidden = true; return; }
        panel.hidden = false;
        document.getElementById('tasted-count').textContent = list.length + '종';
        document.getElementById('tasted-list').innerHTML = list.map(function (t) {
            return '<a class="tasted-row" href="/beans/' + encodeURIComponent(t.id) + '">' +
                       '<span class="em">' + (RATING_MARK[t.rating] || '🫘') + '</span>' +
                       '<span class="nm">' + esc(t.name_ko) +
                           (t.has_note ? '<small>감상을 남겼습니다</small>' : '<small>감상을 남겨보세요</small>') +
                       '</span>' +
                       '<span class="dt">' + shortDate(t.tasted_at) + '</span>' +
                       '<span class="go">→</span>' +
                   '</a>';
        }).join('');
    }

    function renderMissions(p) {
        var panel = document.getElementById('mission-panel');
        if (!p || !p.total) { panel.hidden = true; return; }
        panel.hidden = false;

        document.getElementById('mission-count').textContent = p.unlocked + ' / ' + p.total;
        document.getElementById('mission-grid').innerHTML = p.slots.map(function (s) {
            if (s.locked) {
                return '<div class="slot shut"><div class="mark">🔒</div><div class="q">???</div></div>';
            }
            return '<a class="slot open" href="/beans/' + encodeURIComponent(s.id) + '">' +
                       '<div class="mark">' + (RATING_MARK[s.rating] || '🫘') + '</div>' +
                       '<div class="nm">' + esc(s.name_ko) + '</div>' +
                       '<div class="meta">' + shortDate(s.tasted_at) + '</div>' +
                   '</a>';
        }).join('');

        var left = p.total - p.unlocked;
        document.getElementById('mission-note').textContent = left
            ? left + '종이 남았습니다. 매장에서 그 커피를 만나면 원두 카드의 QR로 열립니다.'
            : '';
        document.getElementById('badge-done').hidden = !p.complete;
    }

    function justOpened(beanId, progress) {
        var name = '';
        (progress && progress.slots || []).forEach(function (s) {
            if (!s.locked && s.id === beanId) name = s.name_ko;
        });
        var box = document.createElement('div');
        box.className = 'just-opened';
        box.innerHTML = '🔓 <b>' + esc(name || '원두') + '</b> 카드가 열렸습니다. ' +
                        '<a href="/beans/' + encodeURIComponent(beanId) + '">보러 가기 →</a>';
        var w = document.getElementById('welcome');
        w.parentNode.insertBefore(box, w.nextSibling);
    }

    fetch('/api/member/me', { credentials: 'same-origin' })
        .then(function (r) { return r.json(); })
        .then(function (d) {
            if (!d || !d.member) { location.replace('/login?next=/me'); return; }
            render(d.member);
            renderMissions(d.progress);
            renderTasted(d.progress);

            var q = new URLSearchParams(location.search);
            if (q.get('welcome')) document.getElementById('welcome').hidden = false;
            var opened = q.get('unlocked');
            if (opened) justOpened(opened, d.progress);
            if (q.get('welcome') || opened) history.replaceState(null, '', '/me');
        })
        .catch(function () { location.replace('/login?next=/me'); });

    document.getElementById('save-nick').addEventListener('click', function () {
        var btn = this;
        var msg = document.getElementById('nick-msg');
        btn.disabled = true;
        fetch('/api/member/me', {
            method: 'PUT',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nickname: document.getElementById('nick').value })
        })
            .then(function (r) { return r.json(); })
            .then(function (d) {
                btn.disabled = false;
                if (!d || !d.success) { msg.textContent = '저장하지 못했습니다.'; return; }
                msg.textContent = '저장했습니다.';
                document.getElementById('hello').textContent =
                    (d.member.nickname || d.member.name || '회원') + '님의 기록';
            })
            .catch(function () { btn.disabled = false; msg.textContent = '저장하지 못했습니다.'; });
    });

    document.getElementById('logout').addEventListener('click', function () {
        fetch('/api/member/logout', { method: 'POST', credentials: 'same-origin' })
            .then(function () { location.replace('/'); })
            .catch(function () { location.replace('/'); });
    });
})();
</script>
</body>
</html>
