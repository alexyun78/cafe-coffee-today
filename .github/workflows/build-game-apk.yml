name: Build Game APK

on:
  push:
    branches: [main]
    paths:
      - 'cafe-game-apk/**'
      - '.github/workflows/build-game-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cafe-game-apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./www/version.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building cafe-game-apk v$VERSION"

      - name: Install npm deps
        run: npm install

      - name: Stamp version into User-Agent
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('./capacitor.config.json', 'utf8'));
            cfg.android = cfg.android || {};
            cfg.android.appendUserAgent = 'CafeGameApp/${{ steps.version.outputs.version }}';
            fs.writeFileSync('./capacitor.config.json', JSON.stringify(cfg, null, 2));
          "
          cat capacitor.config.json

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: cafe-game-apk/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/cafe-game-${{ steps.version.outputs.version }}.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/game-latest.apk
          cat > dist/game-version.json <<EOF
          {
            "version": "${{ steps.version.outputs.version }}",
            "downloadUrl": "/static/downloads/game-latest.apk",
            "publishedAt": "$(date -Is)",
            "buildRun": "${{ github.run_id }}",
            "commit": "${{ github.sha }}"
          }
          EOF
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cafe-game-apk-v${{ steps.version.outputs.version }}
          path: cafe-game-apk/dist/

      # 구 "Deploy APK to server"(iwinv SCP) 스텝은 2026-07-28 서버 해지로 제거.
      # build-apk.yml 과 동일하게 GitHub Release(apk-latest) → Worker /downloads/* 리다이렉트 사용.
      - name: Publish to GitHub Release (apk-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create apk-latest --repo ${{ github.repository }} \
            --title "APK (latest)" --notes "자동 빌드 최신 APK — /apk 페이지에서 다운로드" 2>/dev/null || true
          gh release upload apk-latest --repo ${{ github.repository }} --clobber \
            dist/game-latest.apk \
            dist/cafe-game-${{ steps.version.outputs.version }}.apk \
            dist/game-version.json
